services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-http://host.docker.internal:11434/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-nemotron-3-nano:4b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
  ui:
    build: .
    command: ["streamlit","run","ui.py","--server.address","0.0.0.0","--server.port","8501"]
    ports: ["127.0.0.1:8501:8501"]
    environment:
      API_URL: http://api:8000
      AUTH_FILE: /app/users.json
    depends_on: [api]
